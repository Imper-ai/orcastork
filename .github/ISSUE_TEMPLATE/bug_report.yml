name: Bug report
description: Something in the framework does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security vulnerability, please **do not** file an issue — see
        [SECURITY.md](https://github.com/Imper-ai/orcastork/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        A failing test is by far the most useful thing you can give us. `build_in_memory_runtime()`
        plus `FakeClock` reproduces most bugs in a few lines with no infrastructure at all.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: orcastork version
      placeholder: "0.1.0, or a commit SHA"
    validations:
      required: true

  - type: dropdown
    id: adapters
    attributes:
      label: Which adapters are wired
      multiple: true
      options:
        - in-memory
        - Redis
        - MongoDB
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and the Redis/MongoDB versions if either is involved.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, traceback or telemetry
      description: |
        If a session is stuck rather than erroring, the output of `describe_session` is usually
        the fastest route to a diagnosis.
      render: shell
    validations:
      required: false
